name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # secrets context isn't available in steps.*.if — hoist the presence
    # check into env, which is.
    env:
      HAS_SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN != '' }}
    steps:
      # actions/checkout refuses any path outside $GITHUB_WORKSPACE (no
      # "../"), so the main repo and its siblings are all checked out as
      # subdirectories of the workspace instead — gismo-agent-typescript/,
      # gismo-sdk-typescript/, gismo-contracts/ — which preserves the
      # "file:../gismo-sdk-typescript" dependency and the README's
      # "../gismo-contracts" conformance-test resolution.
      - uses: actions/checkout@v4
        with:
          path: gismo-agent-typescript

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependency-pinning self-check
        working-directory: gismo-agent-typescript
        run: |
          test -f package-lock.json || { echo "package-lock.json is missing — dependencies are not locked" >&2; exit 1; }
          if grep -E '"[a-zA-Z0-9@/_.-]+": *"[\^~]' package.json; then
            echo "unpinned (caret/tilde) dependency found in package.json" >&2
            exit 1
          fi
          echo "all dependencies pinned"

      # @gismo/sdk is a "file:../gismo-sdk-typescript" dependency, and its
      # package.json main/exports point into dist/, so the sibling must be
      # checked out AND built before this repo's `npm ci` will resolve it —
      # not just present on disk. That requires read access to the private
      # gismo-sdk-typescript repo, requiring SIBLING_REPO_TOKEN; see
      # gismo-platform/docs/phase-7-supply-chain.md for provisioning it.
      # Skips (not fails) until that secret exists, and continue-on-error
      # covers the case where the secret exists but a sibling repo isn't in
      # the token's read scope — the hashFiles check on the install/test step
      # only proceeds if the checkout actually succeeded.
      - name: Checkout gismo-sdk-typescript (sibling)
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Axemere-LLC/gismo-sdk-typescript
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: gismo-sdk-typescript

      - name: Build gismo-sdk-typescript (sibling)
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' && hashFiles('gismo-sdk-typescript/package.json') != '' }}
        working-directory: gismo-sdk-typescript
        run: |
          npm ci
          npm run build

      # gismo-contracts is optional at test time: the conformance test
      # resolves GISMO_CONTRACTS_DIR and skips if that checkout is absent, so
      # a missing/failed checkout degrades to fewer tests run rather than a
      # failure.
      - name: Checkout gismo-contracts (sibling)
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Axemere-LLC/gismo-contracts
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: gismo-contracts

      - name: Install dependencies and run test suite
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' && hashFiles('gismo-sdk-typescript/package.json') != '' }}
        working-directory: gismo-agent-typescript
        env:
          GISMO_CONTRACTS_DIR: ${{ github.workspace }}/gismo-contracts
        run: |
          npm ci
          npm test
