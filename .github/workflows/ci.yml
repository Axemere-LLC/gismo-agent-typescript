name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout refuses any path outside $GITHUB_WORKSPACE (no
      # "../"), so the main repo and its sibling are both checked out as
      # subdirectories of the workspace instead — gismo-agent-typescript/,
      # gismo-contracts/.
      - uses: actions/checkout@v4
        with:
          path: gismo-agent-typescript

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependency-pinning self-check
        working-directory: gismo-agent-typescript
        run: |
          test -f package-lock.json || { echo "package-lock.json is missing — dependencies are not locked" >&2; exit 1; }
          if grep -E '"[a-zA-Z0-9@/_.-]+": *"[\^~]' package.json; then
            echo "unpinned (caret/tilde) dependency found in package.json" >&2
            exit 1
          fi
          echo "all dependencies pinned"

      # gismo-contracts is optional at test time: the conformance test
      # resolves GISMO_CONTRACTS_DIR and skips if that checkout is absent, so
      # a missing/failed checkout degrades to fewer tests run rather than a
      # failure. Public repo now, no token needed.
      - name: Checkout gismo-contracts (sibling)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Axemere-LLC/gismo-contracts
          path: gismo-contracts

      # @gismo2026/sdk@1.0.0+ is published to npm — resolved straight from
      # the registry per the committed exact pin, no sibling build needed.
      - name: Install dependencies and run test suite
        working-directory: gismo-agent-typescript
        env:
          GISMO_CONTRACTS_DIR: ${{ github.workspace }}/gismo-contracts
        run: |
          npm ci
          npm test
